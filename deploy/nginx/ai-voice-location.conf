# Include this file inside the HTTPS server block for codex.sunny-string.cn.
# The reverse SSH tunnel binds only to loopback on the public server:
#   127.0.0.1:18006 -> Windows gateway :8006
#   127.0.0.1:18080 -> Windows REST API :8080

location = /ai-voice {
    return 308 /ai-voice/;
}

# Minimal API landing page.
location = /ai-voice/ {
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-voice;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_buffering off;
}

# REST facade routes. The realtime WebSocket remains on /ai-voice/v1/realtime
# and is handled by the gateway location below.
location = /ai-voice/v1/chat/completions {
    proxy_pass http://127.0.0.1:18080/v1/chat/completions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_buffering off;
}

location = /ai-voice/v1/models {
    proxy_pass http://127.0.0.1:18080/v1/models;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 360s;
}

location = /ai-voice/health {
    proxy_pass http://127.0.0.1:18080/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
}

location = /ai-voice/docs {
    proxy_pass http://127.0.0.1:18080/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /ai-voice/openapi.json {
    proxy_pass http://127.0.0.1:18080/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Browser UI, assets, gateway APIs, and realtime WebSocket. The upstream demo
# assumes it is mounted at /, so strip the public prefix and rewrite absolute
# browser paths in text responses back under /ai-voice.
location ^~ /ai-voice/ {
    rewrite ^/ai-voice/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-voice;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 15s;
    proxy_read_timeout 1900s;
    proxy_send_timeout 1900s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 128m;

    sub_filter_once off;
    sub_filter_types text/css text/javascript application/javascript application/json;
    sub_filter '"/static/' '"/ai-voice/static/';
    sub_filter "'/static/" "'/ai-voice/static/";
    sub_filter '`/static/' '`/ai-voice/static/';
    sub_filter '"/api/' '"/ai-voice/api/';
    sub_filter "'/api/" "'/ai-voice/api/";
    sub_filter '`/api/' '`/ai-voice/api/';
    sub_filter '/v1/realtime' '/ai-voice/v1/realtime';
    sub_filter "fetch('/status" "fetch('/ai-voice/status";
    sub_filter 'href="/audio_duplex"' 'href="/ai-voice/audio_duplex"';
    sub_filter 'href="/"' 'href="/ai-voice/"';
}
